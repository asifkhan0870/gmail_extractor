<!DOCTYPE html>
<html>

<head>

    <title>Gmail Lead Extractor</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="/static/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        :root {
            --ink: #141b33;
            --paper: #eef1f5;
            --line: rgba(20, 27, 51, 0.12);
            --gold: #c99a3e;
            --green: #3a9370;
            --muted: #5b6478;
        }

        * { box-sizing: border-box; }

        html, body {
            height: auto !important;
            min-height: 100vh;
            overflow-y: auto !important;
            overflow-x: hidden;
        }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: "IBM Plex Sans", -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            position: static !important;
        }

        .container.py-5, .row.justify-content-center, .col-lg-10 {
            position: static !important;
            height: auto !important;
            overflow: visible !important;
        }

        .container.py-5 { max-width: 1040px; }

        .card.shadow-lg.border-0 {
            background: #ffffff;
            border: 1px solid var(--line) !important;
            border-radius: 4px !important;
            box-shadow: 0 1px 2px rgba(20, 27, 51, 0.04) !important;
        }

        .card-body.p-4 { padding: 3rem !important; }

        h1.mb-1 {
            font-family: "Fraunces", Georgia, serif;
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: -0.01em;
            color: var(--ink);
        }

        .text-muted { color: var(--muted) !important; font-size: 0.95rem; }

        .badge.bg-success {
            background: var(--green) !important;
            font-weight: 500;
            font-size: 0.78rem;
            letter-spacing: 0.02em;
            padding: 0.45em 0.85em;
            border-radius: 20px;
        }

        hr { border-top: 1px solid var(--line); margin: 2rem 0; }

        h4 {
            font-family: "Fraunces", Georgia, serif;
            font-weight: 500;
            font-size: 1.2rem;
            color: var(--ink);
        }

        .btn-success.btn-sm, .btn-secondary.btn-sm {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            font-size: 0.82rem;
            font-weight: 500;
            padding: 0.4rem 0.9rem;
            border-radius: 3px;
        }

        .btn-success.btn-sm:hover { border-color: var(--green); color: var(--green); }
        .btn-secondary.btn-sm:hover { border-color: var(--ink); }

        /* label checklist, spreadsheet-row styling */

        .label-container {
            border: 1px solid var(--line);
            border-radius: 4px;
            max-height: 320px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .label-container::-webkit-scrollbar { width: 8px; }
        .label-container::-webkit-scrollbar-thumb {
            background: #c7cede;
            border-radius: 20px;
        }
        .label-container::-webkit-scrollbar-track { background: transparent; }

        .label-item {
            display: flex;
            align-items: center;
            padding: 0.65rem 1rem;
            border-bottom: 1px solid var(--line);
            font-size: 0.94rem;
        }

        .label-item:last-child { border-bottom: none; }

        .label-item:nth-child(even) { background: #fafbfc; }

        .label-item .form-check-input {
            width: 1rem;
            height: 1rem;
            border-radius: 2px;
            border: 1.5px solid #b7bed0;
        }

        .label-item .form-check-input:checked {
            background-color: var(--gold);
            border-color: var(--gold);
        }

        .label-item label { color: var(--ink); cursor: pointer; }

        .btn-primary.btn-lg {
            background: var(--gold);
            border: none;
            color: #171008;
            font-weight: 600;
            font-size: 0.98rem;
            padding: 0.85rem 2rem;
            border-radius: 3px;
        }

        .btn-primary.btn-lg:hover { background: #d9ab52; }

        /* progress */

        .progress {
            height: 8px;
            background: #e4e7ee;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            background: var(--gold) !important;
            font-size: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border: 1px solid var(--line);
            border-radius: 4px;
            margin-top: 1.75rem;
            overflow: hidden;
        }

        .stat-card {
            padding: 1.1rem 1.2rem;
            border-right: 1px solid var(--line);
        }

        .stat-card:last-child { border-right: none; }

        .stat-card h3 {
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--muted);
            margin: 0 0 0.5rem 0;
            letter-spacing: 0.01em;
        }

        .stat-card p {
            font-family: "IBM Plex Mono", monospace;
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--ink);
            margin: 0;
        }

        @media (max-width: 700px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-card { border-bottom: 1px solid var(--line); }
        }

        .label-progress { margin-top: 1.75rem; }

        .small-bar {
            height: 5px;
            background: #e4e7ee;
            border-radius: 20px;
            overflow: hidden;
            margin: 0.75rem 0 0.5rem 0;
        }

        .small-fill {
            height: 100%;
            width: 0%;
            background: var(--green);
        }

        #labelCounter {
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.85rem;
            color: var(--muted);
            margin: 0;
        }

        #downloadBtn {
            background: var(--green);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.85rem 2.2rem;
            border-radius: 3px;
        }

        #downloadBtn:hover { background: #327f61; color: #fff; }

    </style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="card shadow-lg border-0">

                <div class="card-body p-4">

                    <div class="d-flex justify-content-between align-items-center">

                        <div>

                            <h1 class="mb-1">
                                Gmail Lead Extractor
                            </h1>

                            <p class="text-muted mb-0">
                                Connected as
                                <strong>{{ email }}</strong>
                            </p>

                        </div>

                        <div>

                            <span class="badge bg-success">
                                Connected
                            </span>

                        </div>

                    </div>

                    <hr>

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h4>
                            Select Labels
                        </h4>

                        <div>

                            <button
                                type="button"
                                class="btn btn-success btn-sm"
                                onclick="selectAllLabels()">

                                Select All

                            </button>

                            <button
                                type="button"
                                class="btn btn-secondary btn-sm"
                                onclick="clearLabels()">

                                Clear All

                            </button>

                        </div>

                    </div>

                    <form id="extractForm">

                        <div class="label-container">

                            {% for label in labels %}

                            <div class="label-item">

                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    name="labels"
                                    value="{{ label['id'] }}"
                                    id="lbl{{ loop.index }}">

                                <label
                                    for="lbl{{ loop.index }}"
                                    class="ms-2">

                                    {{ label["name"] }}

                                </label>

                            </div>

                            {% endfor %}

                        </div>

                        <button
                            type="button"
                            class="btn btn-primary btn-lg mt-4"
                            onclick="startExtraction()">

                            Start Extraction

                        </button>

                    </form>

                    <hr class="my-4">

                    <h4>
                        Live Progress
                    </h4>

                    <div class="progress mt-3">

                        <div
                            id="progressBar"
                            class="progress-bar progress-bar-striped progress-bar-animated"
                            style="width:0%">

                            0%

                        </div>

                    </div>

                    <div class="stats-grid">

                        <div class="stat-card">
                            <h3>Status</h3>
                            <p id="statusText">Waiting</p>
                        </div>

                        <div class="stat-card">
                            <h3>Current Label</h3>
                            <p id="currentLabel">-</p>
                        </div>

                        <div class="stat-card">
                            <h3>Messages Scanned</h3>
                            <p id="processedCount">0</p>
                        </div>

                        <div class="stat-card">
                            <h3>Emails Found</h3>
                            <p id="emailsFound">0</p>
                        </div>

                    </div>

                    <div class="label-progress">

                        <h4>
                            Label Progress
                        </h4>

                        <div class="small-bar">

                            <div
                                id="labelBar"
                                class="small-fill">
                            </div>

                        </div>

                        <p id="labelCounter">
                            0 / 0
                        </p>

                    </div>

                    <div class="text-center mt-4">

                        <a
                            id="downloadBtn"
                            class="btn btn-success btn-lg"
                            style="display:none;">

                            Download Excel

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
const USER_EMAIL = "{{ email }}";
</script>

<script src="/static/app.js"></script>

</body>

</html>
